name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Default every job to read-only repository access. Publishing jobs opt into
# package writes explicitly below.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Build the web UI bundle first and fail if the committed artifact under
      # internal/web/static/dist is stale (someone edited the TSX sources but
      # forgot to rebuild and commit dist/). go:embed bakes dist into the binary.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build web UI
        run: |
          cd internal/web/ui
          npm ci
          npm run check
          npm run build

      - name: Ensure committed bundle is up to date
        run: git diff --exit-code internal/web/static/dist

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep CI on a patched toolchain; 1.26.5 fixes GO-2026-5856.
          go-version: '1.26.5'
          cache: true

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      - name: Check Go dependencies for known vulnerabilities
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$GOBIN/govulncheck" ./...

  build:
    # PRs stop at tests; images are built for main / tags / manual runs.
    if: github.event_name != 'pull_request'
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: pmeta
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.pmeta.outputs.image }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.pmeta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.pmeta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.pmeta.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.pmeta.outputs.pair }}

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ steps.pmeta.outputs.pair }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - id: pmeta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Docker Hub mirror: <user>/<repo-short>. Empty if secret not set,
          # which gates the dockerhub login + tag steps below.
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "dh_image=${DOCKERHUB_USERNAME}/${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.pmeta.outputs.dh_image
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # Same tag set on both registries when Docker Hub creds are set;
          # otherwise just GHCR.
          images: |
            ${{ env.REGISTRY }}/${{ steps.pmeta.outputs.image }}
            ${{ steps.pmeta.outputs.dh_image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: create manifest list and push
        working-directory: /tmp/digests
        run: |
          # imagetools create publishes a manifest list to every -t target.
          # buildx copies blobs cross-registry as needed, so the same per-arch
          # digests pushed to GHCR end up mirrored on Docker Hub without a
          # second build.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ steps.pmeta.outputs.image }}@sha256:%s ' *)

      - name: inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ steps.pmeta.outputs.image }}:${{ steps.meta.outputs.version }}
